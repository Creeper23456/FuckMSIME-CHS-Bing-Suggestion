# ============================================================================
#  CodeQL — static security analysis of the C++ service code.
#
#  MSVC environment is set up BEFORE codeql init so the traced build inside
#  build.bat (vcvars + cl) is captured by the CodeQL cpp extractor.
# ============================================================================

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'   # weekly, Monday morning

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (cpp)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          queries: security-extended

      - name: Build (build.bat)
        shell: cmd
        run: build.bat

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:cpp'
