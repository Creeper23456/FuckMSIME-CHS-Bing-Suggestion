# ============================================================================
#  Release — tagged builds (v*).
#
#  checkout -> setup MSVC -> build.bat -> SHA256
#    -> SBOM (CycloneDX, via syft)
#    -> SLSA build-provenance attestation (actions/attest-build-provenance)
#    -> SBOM attestation (actions/attest-sbom)
#    -> workflow artifact + GitHub Release with exe / checksum / SBOM.
#
#  Attestations are stored in the repo's attestation store; verify locally:
#    gh attestation verify <exe> -R Creeper23456/FuckMSIME-CHS-Bing-Suggestion
# ============================================================================

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:      # manual test runs; publish/attest steps are tag-gated

permissions:
  contents: write        # publish the GitHub Release
  id-token: write        # OIDC token for the attestation framework
  attestations: write    # store build provenance / SBOM attestations

env:
  EXE: FuckMSIME-CHS-Bing-Suggestion.exe

jobs:
  release:
    name: Build, SBOM, attest, publish
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build (build.bat)
        shell: cmd
        run: build.bat

      - name: Compute SHA256
        shell: pwsh
        run: |
          $exe = "build/${{ env.EXE }}"
          $sha256 = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$exe.sha256" -Value "$sha256  ${{ env.EXE }}" -Encoding ascii
          Add-Content -Path $env:GITHUB_ENV -Value "SHA256=$sha256"
          Get-Content "$exe.sha256"

      # -- SBOM of the release binary. The sbom-action wrapper always forces
      #    a dir: source (and its 'path' input ignores single files), which
      #    yields SBOMs without the exe digest; a raw syft "file:" scan is
      #    the only form whose output actually binds the binary's SHA-256
      #    (verified locally: metadata/components carry SHA-1+SHA-256).
      #    Version is pinned on purpose; bump manually or via Dependabot-
      #    style review when needed.
      - name: Install syft
        shell: pwsh
        env:
          SYFT_VERSION: '1.42.3'
        run: |
          $url = "https://github.com/anchore/syft/releases/download/v$($env:SYFT_VERSION)/syft_$($env:SYFT_VERSION)_windows_amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\syft.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\syft.zip" -DestinationPath "$env:RUNNER_TEMP\syft" -Force
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\syft"

      - name: Generate SBOM (CycloneDX)
        shell: pwsh
        run: |
          $exe = "build/${{ env.EXE }}"
          $sbomPath = "$exe.cdx.json"
          syft scan "file:$exe" -o "cyclonedx-json=$sbomPath"
          if ($LASTEXITCODE -ne 0) { throw "syft failed with exit code $LASTEXITCODE" }

          # syft 1.42.x on Windows never emits file digests (verified for PE
          # and plain files, even with file-metadata-cataloger + selection:
          # all), so attach the binary's real SHA-256 to the subject
          # component ourselves. Without this the SBOM doesn't reference
          # the artifact it describes.
          $sha256 = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $sbom = Get-Content $sbomPath -Raw | ConvertFrom-Json
          if (-not $sbom.metadata.component) { throw "SBOM has no metadata.component" }
          $sbom.metadata.component |
            Add-Member -NotePropertyName hashes -NotePropertyValue @(
              [PSCustomObject]@{ alg = 'SHA-256'; content = $sha256 }
            ) -Force
          $sbom | ConvertTo-Json -Depth 64 | Set-Content $sbomPath -Encoding utf8NoBOM

          if ((Get-Content $sbomPath -Raw) -notmatch [regex]::Escape($sha256)) {
            throw "SBOM does not carry the binary SHA-256 - refusing to publish"
          }
          Write-Host "::notice::SBOM bound to sha256:$sha256"

      # -- SLSA v1 build provenance: who built what, from which ref/commit.
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/${{ env.EXE }}

      # -- Bind the SBOM to the binary's digest in the attestation store.
      - name: Attest SBOM
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-path: build/${{ env.EXE }}
          sbom-path: build/${{ env.EXE }}.cdx.json

      - name: Upload release bundle (workflow artifact)
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: |
            build/${{ env.EXE }}
            build/${{ env.EXE }}.sha256
            build/${{ env.EXE }}.cdx.json
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Windows x64 服务端二进制（静态链接 /MT，内嵌 requireAdministrator 清单）。

            **SHA-256**: `${{ env.SHA256 }}`

            ### 文件
            - `${{ env.EXE }}` — 主程序（服务本体 + 图形安装向导，单文件）
            - `${{ env.EXE }}.sha256` — sha256sum 格式校验文件
            - `${{ env.EXE }}.cdx.json` — CycloneDX SBOM

            ### 校验
            ```bat
            sha256sum -c ${{ env.EXE }}.sha256
            ```

            ### 供应链
            构建过程附带 SLSA 构建来源证明与 SBOM attestation，可离线验证：

            ```sh
            gh attestation verify ${{ env.EXE }} \
                -R Creeper23456/FuckMSIME-CHS-Bing-Suggestion
            ```
          files: |
            build/${{ env.EXE }}
            build/${{ env.EXE }}.sha256
            build/${{ env.EXE }}.cdx.json
          fail_on_unmatched_files: true
